<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-band explore — Radar Segmentation Evaluation</title>
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="v2.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='17' fill='none' stroke='%2314479a' stroke-width='3'/></svg>">
<script>try{var s=localStorage.getItem("theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <span class="crumb">S-band explore</span>
      <span class="sp"></span>
      <button id="theme" type="button" aria-label="Switch colour theme">Theme</button>
    </div>
    <main id="main" class="explore-ui" tabindex="-1">
      <p id="corrections-banner" class="banner" hidden></p>
      <h1>S-band explore</h1>
      <p id="rule-text"></p>
      <div class="rule-form">
        <label>Night rule
          <select id="rule-mode">
            <option value="every">Every included model</option>
            <option value="allpass">All-pass share</option>
          </select>
        </label>
        <label>Fraction
          <input id="rule-fraction" type="number" min="0" max="1" step="0.05">
        </label>
        <label>Minimum scans
          <input id="rule-min" type="number" min="0" max="28" step="1">
        </label>
        <label>Hour from
          <input id="rule-h0" type="number" min="0" max="23" step="1">
        </label>
        <label>Hour to
          <input id="rule-h1" type="number" min="0" max="23" step="1">
        </label>
      </div>

      <div id="model-controls" class="model-grid"></div>
      <p class="group-row">
        <button type="button" id="group-classifiers">Classifiers</button>
        <button type="button" id="group-segmenters">Segmenters</button>
        <button type="button" id="th-reset-all">Reset thresholds</button>
      </p>

      <div class="view-controls">
        <label>Colour
          <select id="view-mode">
            <option value="agreement">Agreement</option>
            <option value="pass">One model, pass or fail</option>
            <option value="score">One model, score</option>
          </select>
        </label>
        <label>Colour model
          <select id="view-model"></select>
        </label>
        <label>Sort
          <select id="sort-key">
            <option value="date">Date</option>
            <option value="allpass">All-pass fraction</option>
            <option value="mean">Mean score</option>
          </select>
        </label>
        <label>Sort model
          <select id="sort-model"></select>
        </label>
      </div>

      <div class="filters">
        <label class="check"><input type="checkbox" id="f-qualifies"> Qualifies</label>
        <label>Status
          <select id="f-status">
            <option value="all">All statuses</option>
            <option value="complete">Complete</option>
            <option value="partial">Partial</option>
            <option value="gap-skipped">Gap-skipped</option>
            <option value="absent">No files</option>
          </select>
        </label>
        <label>Month
          <select id="f-month">
            <option value="all">All months</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="f-annotation"> Annotation set</label>
        <label>At least k models pass
          <input id="f-k" type="number" min="0" max="6" step="1">
        </label>
        <label>Search
          <input id="scan-search" type="search" placeholder="Night or scan" autocomplete="off" spellcheck="false">
        </label>
        <button type="button" id="scan-go">Go</button>
      </div>
      <p id="find-error" class="small" role="alert"></p>
      <p id="shown-count"></p>
      <p id="result-line"></p>
      <p id="legend"></p>
      <p id="paint-ms" class="small" hidden></p>

      <div class="explore-wrap">
        <div class="grid-col">
          <div class="tabs">
            <button type="button" id="tab-2021">2021</button>
            <button type="button" id="tab-2022">2022</button>
          </div>
          <div id="grid"></div>
          <p id="grid-ready" class="small"></p>
        </div>
        <aside id="scan-panel">
          <h2>Scan panel</h2>
          <p>Selected night <b id="selected-night">none</b>.</p>
          <p id="panel-id"></p>
          <p id="panel-when"></p>
          <p id="panel-qual"></p>
          <div class="nav-row">
            <button type="button" id="prev-night">Previous night</button>
            <button type="button" id="prev-scan">Previous scan</button>
            <button type="button" id="next-scan">Next scan</button>
            <button type="button" id="next-night">Next night</button>
          </div>
          <table class="v2-table" id="panel-scores"></table>
          <div id="viewer"></div>
          <p id="mask-area-note"></p>
        </aside>
      </div>

      <h2>Corrections</h2>
      <ul id="active-corrections"></ul>
    </main>
  </div>
</div>
<script type="module" src="js/explore.js"></script>
</body>
</html>
